<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PartTimeKampus</title>
<style>
:root{--bg:#f1f5ff;--cd:#fff;--tx:#0f1b3d;--mu:#5b6a8c;--nv:#2447d8;--or:#ff7a00;--bd:#dfe7fb;--ok:#0f9d6b;--no:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--cd:#16203a;--tx:#eef2fb;--mu:#9aa8c7;--nv:#7fa0ff;--bd:#27345a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1424;--cd:#16203a;--tx:#eef2fb;--mu:#9aa8c7;--nv:#7fa0ff;--bd:#27345a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}button,input,select,textarea{font:inherit;color:var(--tx)}
.w{max-width:1100px;margin:auto;padding:0 16px}.nav{background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}.nav .w{display:flex;align-items:center;gap:14px;height:60px}
.logo{font-weight:800;color:var(--nv);font-size:19px;display:flex;gap:8px;align-items:center;cursor:pointer}.logo i{background:linear-gradient(135deg,#2f55e6,#6d5df6);color:#fff;border-radius:10px;width:32px;height:32px;display:grid;place-items:center;font-style:normal}.logo b{color:var(--or)}
.lk{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}.lk a{padding:8px 10px;border-radius:8px;text-decoration:none;cursor:pointer;color:var(--mu);font-weight:600}.lk a:hover{background:var(--bg)}
.b{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#2f55e6,#1a37b5);color:#fff;transition:.15s;box-shadow:0 3px 10px #2447d833}.b:hover{filter:brightness(1.12)}.b:active{transform:scale(.97)}.b.o{background:linear-gradient(135deg,#ffa23a,#ff6a00);color:#fff;box-shadow:0 3px 12px #ff7a0055}.b.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}.b.s{padding:6px 11px;font-size:13px}.b.r{background:var(--no)}
.hero{background:radial-gradient(circle at 85% 20%,#ff7a0055,transparent 40%),linear-gradient(135deg,#0b1f5c 0%,#2447d8 65%,#6d5df6 100%);color:#fff;padding:52px 0}.hero .w{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}.hero h1{font-size:clamp(26px,5vw,42px);line-height:1.15;margin:0 0 10px}.hero p{opacity:.9}
.sb{background:var(--cd);border-radius:14px;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:18px}.sb input,.sb select,.f input,.f select,.f textarea{border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:10px;width:100%}
.ill{font-size:90px;text-align:center}
.sec{padding:30px 0}.sec h2{margin:0 0 14px}.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 2px 12px #2447d810}.job{display:flex;flex-direction:column;gap:6px;transition:.2s}.job:hover{transform:translateY(-3px);box-shadow:0 8px 22px #0002}.job.ft{border:2px solid var(--or);background:linear-gradient(180deg,#ff7a0014,var(--cd) 45%)}
.av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2f55e6,#6d5df6);color:#fff;display:grid;place-items:center;font-weight:800}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mu);margin:2px 3px 0 0}.tg.or{background:linear-gradient(135deg,#ffa23a,#ff6a00);color:#fff}.tg.gr{background:#0f9d6b1f;color:var(--ok)}.tg.rd{background:#dc262622;color:var(--no)}
.st{text-align:center}.st b{font-size:28px;color:var(--nv);display:block}
.cat{text-align:center;cursor:pointer;font-weight:600}.cat:hover{border-color:var(--or)}
.ft2{background:#0b1f5c;color:#cfd8f3;padding:26px 0;margin-top:20px;font-size:13px}
.dash{display:grid;grid-template-columns:210px 1fr;gap:16px;padding:16px}.side{display:flex;flex-direction:column;gap:4px}.side a{padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mu)}.side a.on,.side a:hover{background:var(--nv);color:#fff}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--bd);white-space:nowrap}
.f{display:grid;gap:10px}.f label{font-size:12px;font-weight:700;color:var(--mu)}.f.two{grid-template-columns:1fr 1fr}
.mod{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20;padding:12px}.mod .c{max-width:560px;width:100%;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;font-weight:600}
.bar{display:flex;align-items:flex-end;gap:8px;height:120px}.bar div{flex:1;background:var(--or);border-radius:6px 6px 0 0;position:relative}.bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mu)}
.sg td,.sg th{padding:3px;text-align:center}.sg td{cursor:pointer;border:1px solid var(--bd);min-width:44px;font-size:11px}.sg td.x{background:var(--no);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs .b{flex:1}
@media(max-width:760px){.hero .w,.dash{grid-template-columns:1fr}.ill{display:none}.sb{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto}.side a{white-space:nowrap}.lk a.h{display:none}.f.two{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const DAY=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],SL=[['Pagi',7,12],['Siang',12,16],['Sore',16,21]];
const CATS=['Barista & Cafe','Waiter/Waitress','Kasir & Retail','Admin & Data Entry','Freelance & Remote','Event Crew','Content Creator','Tutor & Pengajar','Kurir & Operasional','Lainnya'];
const AREAS=['Tembalang','Semarang Tengah','Banyumanik','Gunungpati','Semarang Selatan','Gajahmungkur','Pedurungan','Semarang Utara'];
const mk=(id,t,co,cat,ar,mn,mx,pay,s,e,d,o,ft,desc)=>({id,t,co,cat,ar,mn,mx,pay,s,e,d,o,feat:ft,on:1,ap:1,v:50+id*13,desc,stu:id%3!=0});
const SEED={users:[{e:'mhs@demo.id',p:'demo',r:'student',n:'Rani Putri',k:'UNNES',pr:'Manajemen',sm:5,ok:1},{e:'usaha@demo.id',p:'demo',r:'employer',n:'Budi (Demo Usaha)',u:'Usaha Demo Semarang',ok:1},{e:'admin@demo.id',p:'admin123',r:'admin',n:'Admin PTK',ok:1},{e:'baru@demo.id',p:'demo',r:'employer',n:'Sari',u:'Toko Baru Demo',ok:0}],
jobs:[mk(1,'Barista Part-Time','Kopi Demo Tembalang','Barista & Cafe','Tembalang',1200000,1800000,'Bulanan',16,21,'12345','usaha@demo.id',1,'Meracik kopi, melayani pelanggan. Pelatihan diberikan, tanpa pengalaman.'),
mk(2,'Crew Outlet','Outlet Demo Simpang Lima','Kasir & Retail','Semarang Tengah',1000000,1500000,'Bulanan',16,22,'123456','lain@x',1,'Melayani kasir dan menata display. Minimal semester 2.'),
mk(3,'Waiter Restoran','Resto Demo Pandanaran','Waiter/Waitress','Semarang Tengah',90000,120000,'Harian',17,22,'560','lain@x',0,'Melayani tamu akhir pekan, seragam disediakan.'),
mk(4,'Event Crew','EO Demo Semarang','Event Crew','Semarang Tengah',150000,250000,'Per proyek',8,17,'60','lain@x',0,'Membantu setup dan operasional acara.'),
mk(5,'Admin Online Shop','Toko Demo Banyumanik','Admin & Data Entry','Banyumanik',900000,1300000,'Bulanan',13,17,'12345','lain@x',0,'Membalas chat, input pesanan, rekap stok.'),
mk(6,'Kasir Minimarket','Minimarket Demo Sekaran','Kasir & Retail','Gunungpati',1100000,1400000,'Bulanan',14,22,'12345','lain@x',0,'Shift sore, jujur dan teliti.'),
mk(7,'Content Creator UMKM','UMKM Demo Semarang Selatan','Content Creator','Semarang Selatan',800000,1500000,'Per proyek',10,16,'135','lain@x',0,'Foto/video produk dan caption media sosial.'),
mk(8,'Tutor Privat','Bimbel Demo Gunungpati','Tutor & Pengajar','Gunungpati',60000,100000,'Per sesi',16,19,'135','lain@x',0,'Mengajar SMP/SMA matematika dan IPA.'),
mk(9,'Crew Coffee Shop','Coffee Demo Gajahmungkur','Barista & Cafe','Gajahmungkur',1000000,1400000,'Bulanan',15,21,'1234','usaha@demo.id',0,'Bar dan kasir, shift sore.'),
mk(10,'Freelance Desain Grafis','Studio Demo Remote','Freelance & Remote','Semarang Tengah',100000,400000,'Per proyek',8,22,'1234560','lain@x',0,'Desain poster dan konten, kerja dari mana saja.'),
mk(11,'Staff Packing','Gudang Demo Pedurungan','Kurir & Operasional','Pedurungan',1000000,1300000,'Bulanan',13,18,'12345','lain@x',0,'Packing dan label paket.'),
mk(12,'Penjaga Booth Event','Booth Demo Kota Lama','Event Crew','Semarang Utara',120000,180000,'Harian',10,20,'60','lain@x',0,'Menjaga booth dan membagikan brosur.')],
apps:[{id:1,j:2,e:'mhs@demo.id',n:'Rani Putri',k:'UNNES',pr:'Manajemen',sm:5,st:'Dalam Peninjauan',d:'2026-11-10'},{id:2,j:1,e:'x1',n:'Dimas A.',k:'UNDIP',pr:'Teknik Industri',sm:3,st:'Terkirim',d:'2026-11-11'},{id:3,j:1,e:'x2',n:'Salsa N.',k:'USM',pr:'Akuntansi',sm:5,st:'Menunggu Wawancara',d:'2026-11-09'}],
sv:[],tx:[{id:'TRX-001',j:1,pk:'7 Hari',am:25000,d:'2026-11-05',st:'Aktif',o:'usaha@demo.id'}],pk:[[7,25000],[14,45000],[30,75000]],rep:0,busy:{},ses:null};
let D;try{D=JSON.parse(localStorage.getItem('ptk2'))}catch(e){}D=D||JSON.parse(JSON.stringify(SEED));
const save=()=>{try{localStorage.setItem('ptk2',JSON.stringify(D))}catch(e){}};
let tab='ov',F={q:'',a:'',c:'',m:0,s:'rel'};
const me=()=>D.users.find(u=>u.e===D.ses),jb=id=>D.jobs.find(j=>j.id==id);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function go(h){location.hash=h;tab='ov'}
function match(j){const b=D.busy;let tot=0,ov=0;[...j.d].forEach(d=>SL.forEach((s,i)=>{if(Math.min(j.e,s[2])-Math.max(j.s,s[1])>0){tot++;if(b[d+'-'+i])ov++}}));return tot?Math.round(100*(1-ov/tot)):100}
const hrs=j=>String(j.s).padStart(2,'0')+'.00–'+String(j.e).padStart(2,'0')+'.00';
const dys=j=>[...j.d].map(d=>DAY[d]).join(', ');
function card(j){const f=j.feat;return `<div class="c job ${f?'ft':''}"><div style="display:flex;gap:10px;align-items:center"><div class="av">${j.co[0]}</div><div><b>${j.t}</b><br><small style="color:var(--mu)">${j.co}</small></div></div><div>${f?'<span class="tg or">Featured · Sponsored</span>':''}${j.o==='usaha@demo.id'||j.id%2?'<span class="tg gr">✓ Verified Employer</span>':''}${j.stu?'<span class="tg">Ramah Mahasiswa</span>':''}<span class="tg">DATA DEMO</span></div><div>📍 ${j.ar} · 🕒 ${hrs(j)}</div><div><b>${rp(j.mn)}–${rp(j.mx)}</b> <small>/ ${j.pay}</small></div><div><span class="tg">${j.cat}</span><span class="tg gr">Dibuka</span></div><button class="b s" onclick="detail(${j.id})">Lihat Detail</button></div>`}
function list(){const q=F.q.toLowerCase();let r=D.jobs.filter(j=>j.on&&j.ap&&(!q||(j.t+j.co).toLowerCase().includes(q))&&(!F.a||j.ar==F.a)&&(!F.c||j.cat==F.c)&&j.mx>=F.m);
r.sort((a,b)=>(b.feat-a.feat)||(F.s=='sal'?b.mx-a.mx:F.s=='new'?b.id-a.id:match(b)-match(a)));return r}
function nav(){const u=me();return `<div class="nav"><div class="w"><div class="logo" onclick="go('home')"><i>🎓</i>PartTime<b>Kampus</b></div><div class="lk"><a class="h" onclick="go('home')">Beranda</a><a onclick="go('jobs')">Cari Lowongan</a><a class="h" onclick="go('jobs');F.c='';">Kategori</a><a class="h" onclick="document.getElementById('how')?.scrollIntoView()||go('home')">Cara Kerja</a><a class="h" onclick="document.getElementById('ab')?.scrollIntoView()">Tentang</a><a class="h" onclick="go('bisnis')">Model Bisnis</a>${u?`<button class="b s" onclick="go('${u.r}')">Dashboard</button><button class="b g s" onclick="D.ses=null;save();go('home')">Keluar</button>`:`<button class="b g s" onclick="go('login')">Masuk</button><button class="b o s" onclick="go('login');reg=1;R()">Daftar</button>`}<button class="b g s" onclick="th()">◐</button></div></div></div>`}
function th(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'}
function foot(){return `<div class="ft2" id="ab"><div class="w"><b>PartTimeKampus</b> — Kuliah Jalan, Penghasilan Aman. Platform prototype untuk mahasiswa UNNES, UNDIP, UNIKA, USM, UIN Walisongo, Polines, dan lainnya.<br>Kontak: halo@parttimekampus.demo · <a href="#home" onclick="toast('Kebijakan privasi: demo')">Privasi</a> · <a href="#home" onclick="toast('Syarat & ketentuan: demo')">Syarat</a> · <a href="#home" onclick="toast('Pusat bantuan: demo')">Bantuan</a> · IG @parttimekampus (demo)<br>Seluruh data lowongan adalah data demonstrasi, bukan mitra resmi.</div></div>`}
function home(){const fj=list().filter(j=>j.feat).concat(list().filter(j=>!j.feat)).slice(0,6);
return nav()+`<div class="hero"><div class="w"><div><h1>Temukan Kerja Part-Time yang Cocok dengan Jadwal Kuliahmu!</h1><p>Temukan peluang kerja fleksibel di Semarang. Mulai hasilkan uang sendiri tanpa harus mengorbankan waktu kuliah.</p><div class="sb"><input id="hq" placeholder="Posisi / pekerjaan"><select id="ha"><option value="">Semua lokasi</option>${AREAS.map(a=>`<option>${a}</option>`)}</select><select id="hc"><option value="">Semua kategori</option>${CATS.map(a=>`<option>${a}</option>`)}</select><button class="b o" onclick="F.q=$('#hq').value;F.a=$('#ha').value;F.c=$('#hc').value;go('jobs')">Cari Lowongan</button></div></div><div class="ill">👩‍💻</div></div></div>
<div class="w sec"><div class="g" id="stt">${[['Lowongan',D.jobs.length*14],['Mahasiswa',2480],['Mitra Usaha',186],['Lamaran Berhasil',730]].map(s=>`<div class="c st"><b data-n="${s[1]}">0</b>${s[0]} (simulasi)</div>`).join('')}</div></div>
<div class="w sec"><h2>Lowongan Unggulan</h2><div class="g">${fj.map(card).join('')}</div></div>
<div class="w sec"><h2>Kategori Pekerjaan</h2><div class="g">${CATS.map(c=>`<div class="c cat" onclick="F.c='${c}';F.q='';F.a='';go('jobs')">${c}</div>`).join('')}</div></div>
<div class="w sec" id="how"><h2>Cara Kerja</h2><div class="g">${['1. Daftar sebagai mahasiswa atau penyedia lowongan','2. Cari atau publikasikan lowongan pekerjaan','3. Lamar pekerjaan atau rekrut kandidat'].map(s=>`<div class="c"><b>${s}</b></div>`).join('')}</div></div>
<div class="w sec"><div class="c" style="text-align:center"><h2>Siap mulai?</h2><button class="b o" onclick="go('login')">Cari Kerja Sekarang</button> <button class="b" onclick="go('login')">Pasang Lowongan</button> <button class="b g" onclick="go('bisnis')">Model Bisnis</button><p style="color:var(--mu)">Gratis untuk mahasiswa. Tanpa biaya daftar atau melamar.</p></div></div>`+foot()}
function jobs(){const r=list();return nav()+`<div class="w sec"><h2>Cari Lowongan</h2><div class="c f two" style="margin-bottom:14px"><input placeholder="Cari posisi / usaha" value="${F.q}" oninput="F.q=this.value;L()"><select onchange="F.a=this.value;L()"><option value="">Semua lokasi</option>${AREAS.map(a=>`<option ${F.a==a?'selected':''}>${a}</option>`)}</select><select onchange="F.c=this.value;L()"><option value="">Semua kategori</option>${CATS.map(a=>`<option ${F.c==a?'selected':''}>${a}</option>`)}</select><select onchange="F.m=+this.value;L()"><option value="0">Gaji min: semua</option><option value="1000000">≥ Rp1.000.000</option><option value="1500000">≥ Rp1.500.000</option></select><select onchange="F.s=this.value;L()"><option value="rel">Paling relevan</option><option value="new">Terbaru</option><option value="sal">Gaji tertinggi</option></select></div><div class="g" id="jl">${r.map(card).join('')||'<div class="c">Tidak ada lowongan cocok.</div>'}</div></div>`+foot()}
function L(){const r=list();$('#jl').innerHTML=r.map(card).join('')||'<div class="c">Tidak ada lowongan cocok.</div>'}
function detail(id){const j=jb(id),u=me();j.v++;save();$('#ov').innerHTML=`<div class="mod" onclick="if(event.target==this)$('#ov').innerHTML=''"><div class="c"><h3>${j.t}</h3><p>${j.co} ${j.feat?'<span class="tg or">Sponsored</span>':''}</p><p>${j.desc}</p><p><b>Tanggung jawab:</b> sesuai arahan supervisor.<br><b>Persyaratan:</b> mahasiswa aktif, disiplin.<br><b>Gaji:</b> ${rp(j.mn)}–${rp(j.mx)} (${j.pay})<br><b>Hari:</b> ${dys(j)} · ${hrs(j)}<br><b>Lokasi:</b> ${j.ar}, Semarang<br><b>Batas daftar:</b> 30 Nov 2026<br><b>Kontak:</b> via platform</p><p style="color:var(--mu);font-size:12px">Data demonstrasi. Label sponsor hanya meningkatkan visibilitas, bukan jaminan diterima.</p>${u&&u.r=='student'?`<p>Kecocokan jadwal: <b>${match(j)}%</b></p>`:''}<button class="b o" onclick="apply(${id})">Lamar Sekarang</button> <button class="b g" onclick="sv(${id})">Simpan</button> <button class="b g" onclick="D.rep++;save();toast('Laporan terkirim ke admin')">Laporkan</button></div></div>`}
function need(){const u=me();if(!u||u.r!='student'){toast('Masuk sebagai mahasiswa dulu');$('#ov').innerHTML='';go('login');return 1}}
function apply(id){if(need())return;const u=me();if(D.apps.some(a=>a.j==id&&a.e==u.e))return toast('Sudah melamar');D.apps.push({id:Date.now(),j:id,e:u.e,n:u.n,k:u.k,pr:u.pr,sm:u.sm,st:'Terkirim',d:'2026-11-12'});save();$('#ov').innerHTML='';toast('Lamaran terkirim (simulasi)')}
function sv(id){if(need())return;if(!D.sv.includes(id))D.sv.push(id);save();toast('Lowongan disimpan')}
let reg=0,rl='student';
function login(){return nav()+`<div class="w sec" style="max-width:480px"><div class="c f"><div class="tabs"><button class="b ${reg?'g':''}" onclick="reg=0;R()">Masuk</button><button class="b ${reg?'':'g'}" onclick="reg=1;R()">Daftar</button></div><label>Jenis akun</label><select id="rl" onchange="rl=this.value;R()"><option value="student" ${rl=='student'?'selected':''}>Mahasiswa</option><option value="employer" ${rl=='employer'?'selected':''}>Pemilik Usaha</option>${reg?'':`<option value="admin" ${rl=='admin'?'selected':''}>Administrator</option>`}</select>
${reg?`<input id="n" placeholder="${rl=='student'?'Nama lengkap':'Nama pemilik'}">${rl=='student'?'<input id="k" placeholder="Asal perguruan tinggi"><input id="pr" placeholder="Program studi"><input id="sm" type="number" placeholder="Semester">':'<input id="u" placeholder="Nama usaha"><input id="al" placeholder="Alamat usaha">'}<input id="wa" placeholder="Nomor WhatsApp">`:''}
<input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="b o" onclick="auth()">${reg?'Daftar':'Masuk'}</button>
<small style="color:var(--mu)">Demo: mhs@demo.id / demo · usaha@demo.id / demo · admin@demo.id / admin123. Admin tidak dapat didaftarkan dari halaman ini.</small></div></div>`}
function auth(){const e=$('#em').value.trim(),p=$('#pw').value;if(!e||!p)return toast('Isi email dan password');
if(reg){if(D.users.some(u=>u.e==e))return toast('Email sudah terdaftar');const n=$('#n').value||e;D.users.push(rl=='student'?{e,p,r:'student',n,k:$('#k').value,pr:$('#pr').value,sm:$('#sm').value,ok:1}:{e,p,r:'employer',n,u:$('#u').value||n,ok:0});D.ses=e;save();toast('Akun dibuat'+(rl=='employer'?' — menunggu verifikasi admin':''));return go(rl)}
const u=D.users.find(u=>u.e==e&&u.p==p&&u.r==rl);if(!u)return toast('Email/password/jenis akun salah');D.ses=e;save();go(rl)}
function side(items){return `<div class="side">${items.map(i=>`<a class="${tab==i[0]?'on':''}" onclick="tab='${i[0]}';R()">${i[1]}</a>`).join('')}</div>`}
function stat(a){return `<div class="g">${a.map(s=>`<div class="c st"><b>${s[1]}</b>${s[0]}</div>`).join('')}</div>`}
function stuDash(u){const my=D.apps.filter(a=>a.e==u.e),m=jb;let c='';
if(tab=='ov')c=`<h2>Halo, ${u.n}! 👋</h2>`+stat([['Lamaran',my.length],['Diproses',my.filter(a=>/Tinjau|Wawancara|Terkirim/.test(a.st)).length],['Diterima',my.filter(a=>a.st=='Diterima').length],['Tersimpan',D.sv.length]])+`<h3>Rekomendasi (Smart Schedule Match)</h3><div class="g">${list().sort((a,b)=>match(b)-match(a)).slice(0,3).map(j=>card(j)+'').join('')}</div>`;
if(tab=='jb')c=`<h3>Cari lowongan</h3><button class="b" onclick="go('jobs')">Buka pencarian lengkap</button>`;
if(tab=='ap')c=`<h3>Lamaran saya</h3><div class="tb c"><table><tr><th>Posisi</th><th>Usaha</th><th>Tanggal</th><th>Status</th></tr>${my.map(a=>`<tr><td>${m(a.j).t}</td><td>${m(a.j).co}</td><td>${a.d}</td><td><span class="tg or">${a.st}</span></td></tr>`).join('')||'<tr><td>Belum ada lamaran</td></tr>'}</table></div>`;
if(tab=='sv')c=`<h3>Tersimpan</h3><div class="g">${D.sv.map(i=>card(jb(i))).join('')||'<div class="c">Belum ada yang disimpan.</div>'}</div>`;
if(tab=='sc')c=`<h3>Smart Schedule Match</h3><p>Klik slot saat kamu kuliah (merah = sibuk).</p><div class="c tb"><table class="sg"><tr><th></th>${SL.map(s=>`<th>${s[0]}</th>`).join('')}</tr>${[1,2,3,4,5,6,0].map(d=>`<tr><th>${DAY[d]}</th>${SL.map((s,i)=>`<td class="${D.busy[d+'-'+i]?'x':''}" onclick="D.busy['${d}-${i}']=!D.busy['${d}-${i}'];save();R()">${s[1]}–${s[2]}</td>`).join('')}</tr>`).join('')}</table></div><h3>Hasil kecocokan</h3>${[...D.jobs].filter(j=>j.on&&j.ap).sort((a,b)=>match(b)-match(a)).map(j=>`<div class="c" style="margin-bottom:8px"><b>${j.t}</b> — ${j.co}<br>Kecocokan jadwal: <b>${match(j)}%</b> · ${dys(j)}, ${hrs(j)}<br><span class="tg ${match(j)>=80?'gr':'rd'}">${match(j)>=80?'Cocok dengan jadwal kuliah':'Bentrok sebagian'}</span></div>`).join('')}`;
if(tab=='nt')c=`<h3>Notifikasi</h3>${my.map(a=>`<div class="c" style="margin-bottom:8px">Lamaran <b>${m(a.j).t}</b>: ${a.st}</div>`).join('')}<div class="c">Lowongan baru: Staff Packing di Pedurungan.</div>`;
if(tab=='pf')c=`<h3>Profil</h3><div class="c f"><label>Nama</label><input id="pn" value="${u.n}"><label>Kampus</label><input id="pk" value="${u.k||''}"><label>Prodi</label><input id="pp" value="${u.pr||''}"><button class="b" onclick="const x=me();x.n=$('#pn').value;x.k=$('#pk').value;x.pr=$('#pp').value;save();toast('Profil disimpan')">Simpan</button></div>`;
return side([['ov','Overview'],['ap','Lamaran'],['sv','Tersimpan'],['sc','Smart Schedule'],['nt','Notifikasi'],['pf','Profil']])+`<div>${c}</div>`}
function empDash(u){const mine=D.jobs.filter(j=>j.o==u.e),tx=D.tx.filter(t=>t.o==u.e);let c='';
if(!u.ok)c=`<div class="c">⏳ Akun menunggu verifikasi admin. Lowongan belum bisa dipublikasikan aktif.</div>`;
else if(tab=='ov'){const ids=mine.map(j=>j.id),ap=D.apps.filter(a=>ids.includes(a.j));c=`<h2>${u.u}</h2>`+stat([['Lowongan aktif',mine.filter(j=>j.on).length],['Pelamar',ap.length],['Dilihat',mine.reduce((s,j)=>s+j.v,0)],['Diproses',ap.filter(a=>a.st!='Diterima'&&a.st!='Ditolak').length]])}
else if(tab=='jb')c=`<h3>Kelola Lowongan</h3><div class="c f two"><input id="jt" placeholder="Judul/posisi"><select id="jc">${CATS.map(a=>`<option>${a}</option>`)}</select><select id="ja">${AREAS.map(a=>`<option>${a}</option>`)}</select><input id="jg" type="number" placeholder="Gaji (Rp)"><input id="js" type="number" placeholder="Jam mulai (mis. 16)"><input id="je" type="number" placeholder="Jam selesai (mis. 21)"><input id="jd" placeholder="Hari (1=Sen..6=Sab, 0=Min) mis. 12345"><textarea id="jx" placeholder="Deskripsi & persyaratan"></textarea><button class="b o" onclick="addJ()">Buat Lowongan</button></div><div class="tb c"><table>${mine.map(j=>`<tr><td>${j.t}</td><td>${j.ap?'Disetujui':'Menunggu admin'}</td><td>${j.v} dilihat</td><td><button class="b s g" onclick="jb(${j.id}).on=!jb(${j.id}).on;save();R()">${j.on?'Nonaktifkan':'Aktifkan'}</button> <button class="b s r" onclick="D.jobs=D.jobs.filter(x=>x.id!=${j.id});save();R()">Hapus</button></td></tr>`).join('')}</table></div>`;
else if(tab=='pl'){const ids=mine.map(j=>j.id);c=`<h3>Pelamar</h3><div class="tb c"><table><tr><th>Nama</th><th>Kampus</th><th>Prodi</th><th>Sem</th><th>Posisi</th><th>Status</th><th></th></tr>${D.apps.filter(a=>ids.includes(a.j)).map(a=>`<tr><td>${a.n}</td><td>${a.k}</td><td>${a.pr}</td><td>${a.sm}</td><td>${jb(a.j).t}</td><td>${a.st}</td><td>${['Diterima','Ditolak','Menunggu Wawancara'].map(s=>`<button class="b s g" onclick="D.apps.find(x=>x.id==${a.id}).st='${s}';save();R()">${s=='Menunggu Wawancara'?'Wawancara':s}</button>`).join(' ')}</td></tr>`).join('')}</table></div>`}
else if(tab=='pr')c=`<h3>Promosikan Lowongan (Featured)</h3><p style="color:var(--mu)">Pembayaran hanya meningkatkan visibilitas, bukan menjamin kandidat diterima. Pembayaran di sini simulasi.</p><div class="c f"><select id="pj">${mine.map(j=>`<option value="${j.id}">${j.t}</option>`)}</select><select id="pp2">${D.pk.map((p,i)=>`<option value="${i}">${p[0]} Hari — ${rp(p[1])}</option>`)}</select><button class="b o" onclick="pay()">Bayar (simulasi)</button></div>`;
else if(tab=='tx')c=`<h3>Riwayat Transaksi</h3><div class="tb c"><table><tr><th>ID</th><th>Paket</th><th>Nominal</th><th>Tanggal</th><th>Status</th></tr>${tx.map(t=>`<tr><td>${t.id}</td><td>${t.pk}</td><td>${rp(t.am)}</td><td>${t.d}</td><td>${t.st}</td></tr>`).join('')}</table></div>`;
return side([['ov','Overview'],['jb','Lowongan'],['pl','Pelamar'],['pr','Promosi'],['tx','Transaksi']])+`<div>${c}</div>`}
function addJ(){const u=me();if(!$('#jt').value)return toast('Judul wajib diisi');const g=+$('#jg').value||1000000;D.jobs.push({...mk(Date.now()%100000,$('#jt').value,u.u,$('#jc').value,$('#ja').value,g,g,'Bulanan',+$('#js').value||16,+$('#je').value||21,$('#jd').value||'12345',u.e,0,$('#jx').value||'-'),ap:0,v:0});save();toast('Dikirim, menunggu persetujuan admin');R()}
function pay(){const j=$('#pj').value,p=D.pk[$('#pp2').value];if(!j)return toast('Buat lowongan dulu');D.tx.push({id:'TRX-'+String(D.tx.length+1).padStart(3,'0'),j:+j,pk:p[0]+' Hari',am:p[1],d:'2026-11-12',st:'Menunggu Verifikasi',o:me().e});save();toast('Menunggu verifikasi admin');tab='tx';R()}
function admDash(){let c='';const st=['Menunggu Pembayaran','Menunggu Verifikasi','Aktif','Kedaluwarsa'];
if(tab=='ov')c=`<h2>Admin</h2>`+stat([['Pengguna',D.users.length],['Mahasiswa',D.users.filter(u=>u.r=='student').length],['Usaha',D.users.filter(u=>u.r=='employer').length],['Lowongan aktif',D.jobs.filter(j=>j.on&&j.ap).length],['Lamaran',D.apps.length],['Usaha tunggu verifikasi',D.users.filter(u=>u.r=='employer'&&!u.ok).length],['Pendapatan promosi',rp(D.tx.filter(t=>t.st=='Aktif').reduce((s,t)=>s+t.am,0))],['Laporan',D.rep]])+`<h3>Lowongan per kategori</h3><div class="c bar" style="padding-bottom:30px">${CATS.slice(0,7).map(k=>{const n=D.jobs.filter(j=>j.cat==k).length;return `<div style="height:${20+n*30}px"><span>${n}</span></div>`}).join('')}</div>`;
if(tab=='us')c=`<h3>Pengguna</h3><div class="tb c"><table>${D.users.map(u=>`<tr><td>${u.n}</td><td>${u.e}</td><td>${u.r}</td><td>${u.ok?'Aktif':'Belum verifikasi'}</td><td>${u.r=='admin'?'':`<button class="b s g" onclick="D.users.find(x=>x.e=='${u.e}').ok=${u.ok?0:1};save();R()">${u.ok?'Nonaktifkan':'Verifikasi'}</button>`}</td></tr>`).join('')}</table></div>`;
if(tab=='lw')c=`<h3>Verifikasi Lowongan</h3><div class="tb c"><table>${D.jobs.map(j=>`<tr><td>${j.t}</td><td>${j.co}</td><td>${j.ap?'Disetujui':'Menunggu'}</td><td><button class="b s" onclick="jb(${j.id}).ap=1;save();R()">Setujui</button> <button class="b s r" onclick="D.jobs=D.jobs.filter(x=>x.id!=${j.id});save();R()">Hapus</button></td></tr>`).join('')}</table></div>`;
if(tab=='tx')c=`<h3>Transaksi & Featured</h3><div class="tb c"><table>${D.tx.map(t=>`<tr><td>${t.id}</td><td>${jb(t.j)?.co||'-'}</td><td>${t.pk}</td><td>${rp(t.am)}</td><td>${t.st}</td><td><button class="b s" onclick="setTx('${t.id}','Aktif')">Aktifkan</button> <button class="b s g" onclick="setTx('${t.id}','Kedaluwarsa')">Kedaluwarsa</button></td></tr>`).join('')}</table></div><h3>Harga paket</h3><div class="c f">${D.pk.map((p,i)=>`<label>${p[0]} hari</label><input type="number" value="${p[1]}" onchange="D.pk[${i}][1]=+this.value;save();toast('Harga diubah')">`).join('')}</div>`;
return side([['ov','Overview'],['us','Pengguna'],['lw','Lowongan'],['tx','Transaksi & Paket']])+`<div>${c}</div>`}
function setTx(id,s){const t=D.tx.find(x=>x.id==id);t.st=s;const j=jb(t.j);if(j)j.feat=s=='Aktif';save();R()}
function dash(r){const u=me();if(!u||u.r!=r){return go('login'),''}return nav()+`<div class="w dash">${r=='student'?stuDash(u):r=='employer'?empDash(u):admDash()}</div>`}
function bisnis(){const S=[['Featured Listing','Usaha membayar agar lowongan tampil di atas (Rp25rb–75rb). Pendapatan utama tahap awal.'],['Langganan usaha','Paket bulanan: kuota lowongan lebih banyak dan akses database kandidat.'],['Success fee','Tarif kecil hanya saat kandidat diterima. Mahasiswa tetap gratis.'],['Sponsor lokal','Banner atau konten dari kafe, kos, laundry, dan brand yang menarget mahasiswa.'],['Layanan rekrutmen','Tim PartTimeKampus bantu menyaring kandidat dengan tarif per paket.'],['Kerja sama kampus','Job fair mini dan kolaborasi dengan career center.']];const I=[['bc','Biaya bulanan (Rp)',2000000],['fn','Jumlah Featured / bulan',30],['fp','Harga rata-rata Featured (Rp)',45000],['sn','Usaha berlangganan',5],['sp','Harga langganan (Rp)',150000],['cn','Kandidat diterima (success fee)',10],['cp','Fee per kandidat (Rp)',25000],['an','Sponsor lokal',2],['ap','Harga sponsor (Rp)',300000]];setTimeout(sim,0);return nav()+`<div class="w sec"><h2>Model Bisnis PartTimeKampus</h2><p style="color:var(--mu)">Freemium: mahasiswa gratis. Pendapatan utama dari promosi berbayar, ditambah sumber lain agar tidak bergantung pada satu jenis.</p><div class="g">${S.map(s=>`<div class="c"><b>${s[0]}</b><br><small style="color:var(--mu)">${s[1]}</small></div>`).join('')}</div></div><div class="w sec"><h2>Simulasi Titik Impas</h2><p style="color:var(--mu)">Angka di bawah hanya asumsi, ubah sesuai skenario kamu.</p><div class="c f two">${I.map(i=>`<div><label>${i[1]}</label><input id="${i[0]}" type="number" value="${i[2]}" oninput="sim()"></div>`).join('')}</div><div class="c tb" id="sr" style="margin-top:14px"></div></div>`+foot()}
function sim(){const v=i=>+$('#'+i).value||0,r=[['Featured Listing',v('fn')*v('fp')],['Langganan usaha',v('sn')*v('sp')],['Success fee',v('cn')*v('cp')],['Sponsor lokal',v('an')*v('ap')]],t=r.reduce((s,x)=>s+x[1],0),l=t-v('bc'),need=v('fp')?Math.max(0,Math.ceil((v('bc')-(t-r[0][1]))/v('fp'))):0;$('#sr').innerHTML='<table>'+r.map(x=>`<tr><td>${x[0]}</td><td>${rp(x[1])}</td></tr>`).join('')+`<tr><th>Total pendapatan</th><th>${rp(t)}</th></tr><tr><td>Biaya bulanan</td><td>${rp(v('bc'))}</td></tr><tr><th>${l>=0?'Laba':'Rugi'}</th><th style="color:var(${l>=0?'--ok':'--no'})">${rp(Math.abs(l))}</th></tr></table><p>Titik impas: sekitar <b>${need}</b> paket Featured per bulan (dengan sumber pendapatan lain seperti di atas).</p>`}
function R(){const h=location.hash.slice(1)||'home';$('#app').innerHTML=h=='bisnis'?bisnis():h=='jobs'?jobs():h=='login'?login():['student','employer','admin'].includes(h)?dash(h):home();$('#ov').innerHTML='';
document.querySelectorAll('[data-n]').forEach(e=>{const t=+e.dataset.n;let n=0;const iv=setInterval(()=>{n+=Math.ceil(t/30);if(n>=t){n=t;clearInterval(iv)}e.textContent=n.toLocaleString('id-ID')},30)})}
addEventListener('hashchange',R);R();
</script></body></html>
