else if(tab=='ov'){const ids=mine.map(j=>j.id),ap=D.apps.filter(a=>ids.includes(a.j));c=`<h2>${u.u}</h2>`+stat([['Lowongan aktif',mine.filter(j=>j.on).length],['Pelamar',ap.length],['Dilihat',mine.reduce((s,j)=>s+j.v,0)],['Diproses',ap.filter(a=>a.st!='Diterima'&&a.st!='Ditolak').length]])}
else if(tab=='jb')c=`<h3>Kelola Lowongan</h3><div class="c f two"><input id="jt" placeholder="Judul/posisi"><select id="jc">${CATS.map(a=>`<option>${a}</option>`)}</select><select id="ja">${AREAS.map(a=>`<option>${a}</option>`)}</select><input id="jg" type="number" placeholder="Gaji (Rp)"><input id="js" type="number" placeholder="Jam mulai (mis. 16)"><input id="je" type="number" placeholder="Jam selesai (mis. 21)"><input id="jd" placeholder="Hari (1=Sen..6=Sab, 0=Min) mis. 12345"><textarea id="jx" placeholder="Deskripsi & persyaratan"></textarea><button class="b o" onclick="addJ()">Buat Lowongan</button></div><div class="tb c"><table>${mine.map(j=>`<tr><td>${j.t}</td><td>${j.ap?'Disetujui':'Menunggu admin'}</td><td>${j.v} dilihat</td><td><button class="b s g" onclick="jb(${j.id}).on=!jb(${j.id}).on;save();R()">${j.on?'Nonaktifkan':'Aktifkan'}</button> <button class="b s r" onclick="D.jobs=D.jobs.filter(x=>x.id!=${j.id});save();R()">Hapus</button></td></tr>`).join('')}</table></div>`;
else if(tab=='pl'){const ids=mine.map(j=>j.id);c=`<h3>Pelamar</h3><div class="tb c"><table><tr><th>Nama</th><th>Kampus</th><th>Prodi</th><th>Sem</th><th>Posisi</th><th>Status</th><th></th></tr>${D.apps.filter(a=>ids.includes(a.j)).map(a=>`<tr><td>${a.n}</td><td>${a.k}</td><td>${a.pr}</td><td>${a.sm}</td><td>${jb(a.j).t}</td><td>${a.st}</td><td><button class="b s" onclick="appDet(${a.id})">Lihat CV dan Detail</button> ${['Diterima','Ditolak','Menunggu Wawancara'].map(s=>`<button class="b s g" onclick="D.apps.find(x=>x.id==${a.id}).st='${s}';save();R()">${s=='Menunggu Wawancara'?'Wawancara':s}</button>`).join(' ')}</td></tr>`).join('')}</table></div>`}
else if(tab=='pr')c=`<h3>Promosikan Lowongan (Featured)</h3><p style="color:var(--mu)">Pembayaran hanya meningkatkan visibilitas, bukan menjamin kandidat diterima. Pembayaran di sini simulasi.</p><div class="c f"><select id="pj">${mine.map(j=>`<option value="${j.id}">${j.t}</option>`)}</select><select id="pp2">${D.pk.map((p,i)=>`<option value="${i}">${p[0]} Hari — ${rp(p[1])}</option>`)}</select><button class="b o" onclick="pay()">Bayar (simulasi)</button></div>`;
else if(tab=='tx')c=`<h3>Riwayat Transaksi</h3><div class="tb c"><table><tr><th>ID</th><th>Paket</th><th>Nominal</th><th>Tanggal</th><th>Status</th></tr>${tx.map(t=>`<tr><td>${t.id}</td><td>${t.pk}</td><td>${rp(t.am)}</td><td>${t.d}</td><td>${t.st}</td></tr>`).join('')}</table></div>`;
return side([['ov','Overview'],['jb','Lowongan'],['pl','Pelamar'],['pr','Promosi'],['tx','Transaksi']])+`<div>${c}</div>`}
function addJ(){const u=me();if(!$('#jt').value)return toast('Judul wajib diisi');const g=+$('#jg').value||1000000;D.jobs.push({...mk(Date.now()%100000,$('#jt').value,u.u,$('#jc').value,$('#ja').value,g,g,'Bulanan',+$('#js').value||16,+$('#je').value||21,$('#jd').value||'12345',u.e,0,$('#jx').value||'-'),ap:0,v:0});save();toast('Dikirim, menunggu persetujuan admin');R()}
function pay(){const j=$('#pj').value,p=D.pk[$('#pp2').value];if(!j)return toast('Buat lowongan dulu');D.tx.push({id:'TRX-'+String(D.tx.length+1).padStart(3,'0'),j:+j,pk:p[0]+' Hari',am:p[1],d:'2026-11-12',st:'Menunggu Verifikasi',o:me().e});save();toast('Menunggu verifikasi admin');tab='tx';R()}
function admDash(){let c='';const st=['Menunggu Pembayaran','Menunggu Verifikasi','Aktif','Kedaluwarsa'];
if(tab=='ov')c=`<h2>Admin</h2>`+stat([['Pengguna',D.users.length],['Mahasiswa',D.users.filter(u=>u.r=='student').length],['Usaha',D.users.filter(u=>u.r=='employer').length],['Lowongan aktif',D.jobs.filter(j=>j.on&&j.ap).length],['Lamaran',D.apps.length],['Usaha tunggu verifikasi',D.users.filter(u=>u.r=='employer'&&!u.ok).length],['Pendapatan promosi',rp(D.tx.filter(t=>t.st=='Aktif').reduce((s,t)=>s+t.am,0))],['Laporan',D.rep]])+`<h3>Lowongan per kategori</h3><div class="c bar" style="padding-bottom:30px">${CATS.slice(0,7).map(k=>{const n=D.jobs.filter(j=>j.cat==k).length;return `<div style="height:${20+n*30}px"><span>${n}</span></div>`}).join('')}</div>`;
if(tab=='us')c=`<h3>Pengguna</h3><div class="tb c"><table>${D.users.map(u=>`<tr><td>${u.n}</td><td>${u.e}</td><td>${u.r}</td><td>${u.ok?'Aktif':'Belum verifikasi'}</td><td>${u.r=='admin'?'':`<button class="b s g" onclick="D.users.find(x=>x.e=='${u.e}').ok=${u.ok?0:1};save();R()">${u.ok?'Nonaktifkan':'Verifikasi'}</button>`}</td></tr>`).join('')}</table></div>`;
if(tab=='lw')c=`<h3>Verifikasi Lowongan</h3><div class="tb c"><table>${D.jobs.map(j=>`<tr><td>${j.t}</td><td>${j.co}</td><td>${j.ap?'Disetujui':'Menunggu'}</td><td><button class="b s" onclick="jb(${j.id}).ap=1;save();R()">Setujui</button> <button class="b s r" onclick="D.jobs=D.jobs.filter(x=>x.id!=${j.id});save();R()">Hapus</button></td></tr>`).join('')}</table></div>`;
if(tab=='tx')c=`<h3>Transaksi & Featured</h3><div class="tb c"><table>${D.tx.map(t=>`<tr><td>${t.id}</td><td>${jb(t.j)?.co||'-'}</td><td>${t.pk}</td><td>${rp(t.am)}</td><td>${t.st}</td><td><button class="b s" onclick="setTx('${t.id}','Aktif')">Aktifkan</button> <button class="b s g" onclick="setTx('${t.id}','Kedaluwarsa')">Kedaluwarsa</button></td></tr>`).join('')}</table></div><h3>Harga paket</h3><div class="c f">${D.pk.map((p,i)=>`<label>${p[0]} hari</label><input type="number" value="${p[1]}" onchange="D.pk[${i}][1]=+this.value;save();toast('Harga diubah')">`).join('')}</div>`;
return side([['ov','Overview'],['us','Pengguna'],['lw','Lowongan'],['tx','Transaksi & Paket']])+`<div>${c}</div>`}
function setTx(id,s){const t=D.tx.find(x=>x.id==id);t.st=s;const j=jb(t.j);if(j)j.feat=s=='Aktif';save();R()}
function dash(r){const u=me();if(!u||u.r!=r){return go('login'),''}return nav()+`<div class="w dash">${r=='student'?stuDash(u):r=='employer'?empDash(u):admDash()}</div>`}
function bisnis(){const S=[['Featured Listing','Usaha membayar agar lowongan tampil di atas (Rp25rb–75rb). Pendapatan utama tahap awal.'],['Langganan usaha','Paket bulanan: kuota lowongan lebih banyak dan akses database kandidat.'],['Success fee','Tarif kecil hanya saat kandidat diterima. Mahasiswa tetap gratis.'],['Sponsor lokal','Banner atau konten dari kafe, kos, laundry, dan brand yang menarget mahasiswa.'],['Layanan rekrutmen','Tim PartTimeKampus bantu menyaring kandidat dengan tarif per paket.'],['Kerja sama kampus','Job fair mini dan kolaborasi dengan career center.']];const I=[['bc','Biaya bulanan (Rp)',2000000],['fn','Jumlah Featured / bulan',30],['fp','Harga rata-rata Featured (Rp)',45000],['sn','Usaha berlangganan',5],['sp','Harga langganan (Rp)',150000],['cn','Kandidat diterima (success fee)',10],['cp','Fee per kandidat (Rp)',25000],['an','Sponsor lokal',2],['ap','Harga sponsor (Rp)',300000]];setTimeout(sim,0);return nav()+`<div class="w sec"><h2>Model Bisnis PartTimeKampus</h2><p style="color:var(--mu)">Freemium: mahasiswa gratis. Pendapatan utama dari promosi berbayar, ditambah sumber lain agar tidak bergantung pada satu jenis.</p><div class="g">${S.map(s=>`<div class="c"><b>${s[0]}</b><br><small style="color:var(--mu)">${s[1]}</small></div>`).join('')}</div></div><div class="w sec"><h2>Simulasi Titik Impas</h2><p style="color:var(--mu)">Angka di bawah hanya asumsi, ubah sesuai skenario kamu.</p><div class="c f two">${I.map(i=>`<div><label>${i[1]}</label><input id="${i[0]}" type="number" value="${i[2]}" oninput="sim()"></div>`).join('')}</div><div class="c tb" id="sr" style="margin-top:14px"></div></div>`+foot()}
function sim(){const v=i=>+$('#'+i).value||0,r=[['Featured Listing',v('fn')*v('fp')],['Langganan usaha',v('sn')*v('sp')],['Success fee',v('cn')*v('cp')],['Sponsor lokal',v('an')*v('ap')]],t=r.reduce((s,x)=>s+x[1],0),l=t-v('bc'),need=v('fp')?Math.max(0,Math.ceil((v('bc')-(t-r[0][1]))/v('fp'))):0;$('#sr').innerHTML='<table>'+r.map(x=>`<tr><td>${x[0]}</td><td>${rp(x[1])}</td></tr>`).join('')+`<tr><th>Total pendapatan</th><th>${rp(t)}</th></tr><tr><td>Biaya bulanan</td><td>${rp(v('bc'))}</td></tr><tr><th>${l>=0?'Laba':'Rugi'}</th><th style="color:var(${l>=0?'--ok':'--no'})">${rp(Math.abs(l))}</th></tr></table><p>Titik impas: sekitar <b>${need}</b> paket Featured per bulan (dengan sumber pendapatan lain seperti di atas).</p>`}
function R(){const h=location.hash.slice(1)||'home';$('#app').innerHTML=h=='bisnis'?bisnis():h=='jobs'?jobs():h=='login'?login():['student','employer','admin'].includes(h)?dash(h):home();$('#ov').innerHTML='';
document.querySelectorAll('[data-n]').forEach(e=>{const t=+e.dataset.n;let n=0;const iv=setInterval(()=>{n+=Math.ceil(t/30);if(n>=t){n=t;clearInterval(iv)}e.textContent=n.toLocaleString('id-ID')},30)})}
addEventListener('hashchange',R);R();
</script></body></html>
